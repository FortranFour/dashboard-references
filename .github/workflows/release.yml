name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build && npm run check && npm test
      - name: Validate HACS package
        uses: hacs/action@main
        with:
          category: plugin
      - name: Verify tag matches package version
        run: node -e "if ('v'+JSON.parse(require('fs').readFileSync('package.json')).version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/dashboard-references.js --clobber
            gh release edit "$GITHUB_REF_NAME" --prerelease=false --latest
          else
            gh release create "$GITHUB_REF_NAME" dist/dashboard-references.js --title "Dashboard References $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md --latest
          fi
